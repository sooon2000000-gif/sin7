const IDS=Object.keys(DATA);
const $=s=>document.querySelector(s); const app=$('#app');
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function tone(freq=520,d=.08,type='sine'){try{const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.06,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function parseRoute(){const h=decodeURIComponent(location.hash.replace(/^#/,''));const m=h.match(/^(class|home)\/(.+)$/);return m&&DATA[m[2]]?{mode:m[1],lesson:m[2]}:null}
function go(mode,id){location.hash=`${mode}/${id}`}
function landing(){document.title='الرياضيات المتقدمة 11 — الأنشطة التفاعلية';app.innerHTML=`<section class="hero"><h1>الأنشطة التفاعلية</h1><p>ملف واحد حقيقي بصيغة HTML، يضم جميع دروس الفصل الأول. يعمل دون اتصال بعد حفظه على الجهاز.</p><p><span class="pill">٣١ درسًا</span><span class="pill">مسابقة مجموعات</span><span class="pill">مراجعة منزلية</span></p></section><section class="card" style="margin-top:16px"><div class="controls"><select id="pick">${IDS.map(id=>`<option value="${id}">${id} — ${esc(DATA[id].title)}</option>`).join('')}</select></div><div class="grid"><button class="choice" id="classGo"><b>مسابقة داخل الحصة</b><small>٤ مجموعات × ٥ أسئلة، ٣٠ ثانية، نقاط حسب سرعة الإجابة.</small></button><button class="choice" id="homeGo"><b>مراجعة الطالب في المنزل</b><small>١٠ أسئلة، ٣٠ ثانية لكل سؤال، الدرجة القصوى ١٠٠.</small></button></div></section>`;$('#classGo').onclick=()=>go('class',$('#pick').value);$('#homeGo').onclick=()=>go('home',$('#pick').value)}
let T=null;
function stopTimer(){if(T)clearInterval(T);T=null}
function confetti(){const c=$('#confetti');c.innerHTML='';for(let i=0;i<90;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=`hsl(${Math.random()*360} 80% 55%)`;x.style.animationDuration=(2+Math.random()*2.7)+'s';x.style.animationDelay=(Math.random()*.8)+'s';c.appendChild(x)}setTimeout(()=>c.innerHTML='',5200)}
function showRank(names,scores,next){const order=scores.map((s,i)=>({i,s})).sort((a,b)=>b.s-a.s);const max=Math.max(1,...scores);$('#modal').innerHTML=`<h2 style="margin-top:0">تقدم المجموعات</h2><div class="ranking">${order.map((r,k)=>`<div class="rank"><span class="n">${AR(k+1)}</span><div><b>${esc(names[r.i])}</b><div class="bar"><i style="width:${Math.round(r.s/max*100)}%"></i></div></div><strong>${AR(r.s)} نقطة</strong></div>`).join('')}</div><button class="btn" id="continue">متابعة</button>`;$('#overlay').classList.add('show');$('#continue').onclick=()=>{$('#overlay').classList.remove('show');next()}}
function startClass(id){stopTimer();const D=DATA[id],qs=D.classQuiz.slice(0,20);let idx=0,left=30,start=0,locked=false;let names=['المجموعة ١','المجموعة ٢','المجموعة ٣','المجموعة ٤'],scores=[0,0,0,0];
app.innerHTML=`<section class="card"><h2 style="margin-top:0">${esc(id+' — '+D.title)}</h2><div class="note">عدّل أسماء المجموعات ثم ابدأ. ينتقل الدور بالتتابع، ولكل مجموعة خمسة أسئلة.</div><div class="groupNames">${names.map((n,i)=>`<input class="gname" data-i="${i}" type="text" value="${esc(n)}">`).join('')}</div><div class="controls"><button class="btn" id="start">ابدأ المسابقة</button><button class="btn secondary" id="change">تغيير الدرس</button></div></section><section id="play" class="hidden"><div class="scores" id="scores"></div><section class="card"><div style="display:flex;gap:12px;align-items:center"><b id="prog"></b><div class="spacer"></div><div class="timer" id="timer">30</div></div><div class="meter"><i id="tm"></i></div><div class="qbox" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div></section></section>`;
$('#change').onclick=()=>{location.hash='';landing()};$('#start').onclick=()=>{document.querySelectorAll('.gname').forEach(x=>names[+x.dataset.i]=x.value.trim()||names[+x.dataset.i]);$('#play').classList.remove('hidden');$('#start').closest('.card').classList.add('hidden');render()};
function renderScores(){const g=idx%4;$('#scores').innerHTML=names.map((n,i)=>`<div class="scoreCard ${i===g?'current':''}"><b>${esc(n)}</b><span class="scoreNum">${AR(scores[i])}</span></div>`).join('')}
function render(){stopTimer();if(idx>=qs.length){finish();return}locked=false;left=30;start=Date.now();renderScores();const g=idx%4,q=qs[idx];$('#prog').textContent=`السؤال ${AR(idx+1)} من ${AR(qs.length)} — دور ${names[g]}`;$('#timer').textContent=AR(left);$('#tm').style.width='100%';$('#q').textContent=q.q;$('#fb').className='feedback';$('#fb').textContent='';$('#opts').innerHTML=q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));T=setInterval(()=>{left--;$('#timer').textContent=AR(left);$('#tm').style.width=(left/30*100)+'%';if(left<=0){stopTimer();answer(-1)}},1000)}
function answer(a){if(locked)return;locked=true;stopTimer();const q=qs[idx],g=idx%4,elapsed=Math.min(30,(Date.now()-start)/1000);let pts=0;if(a===q.answer){pts=Math.max(1,10-Math.floor(elapsed/3));scores[g]+=pts;tone(720,.12,'triangle')}else tone(180,.15,'sawtooth');document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===q.answer)b.classList.add('correct');else if(i===a)b.classList.add('wrong')});const fb=$('#fb');fb.className='feedback '+(a===q.answer?'good':'bad');fb.innerHTML=a===q.answer?`إجابة صحيحة — +${AR(pts)} نقاط<br><small>${esc(q.explanation||'')}</small>`:`${a<0?'انتهى الوقت':'إجابة غير صحيحة'} — ٠ نقطة<br><small>${esc(q.explanation||'')}</small>`;setTimeout(()=>showRank(names,scores,()=>{idx++;render()}),900)}
function finish(){stopTimer();const order=scores.map((s,i)=>({i,s})).sort((a,b)=>b.s-a.s);confetti();app.innerHTML=`<section class="card final"><h2>انتهت المسابقة</h2><div class="bigScore">${esc(names[order[0].i])}</div><p>المركز الأول — ${AR(order[0].s)} نقطة</p><div class="ranking">${order.map((r,k)=>`<div class="rank"><span class="n">${AR(k+1)}</span><b>${esc(names[r.i])}</b><strong>${AR(r.s)} نقطة</strong></div>`).join('')}</div><div class="controls" style="justify-content:center"><button class="btn" onclick="startClass('${id}')">إعادة المسابقة</button><button class="btn secondary" onclick="location.hash=''">الرئيسية</button></div></section>`}
}
function startHome(id){stopTimer();const D=DATA[id],qs=D.homeReview.slice(0,10);let idx=0,left=30,start=0,locked=false,score=0,correct=0;app.innerHTML=`<section class="card"><h2 style="margin-top:0">${esc(id+' — '+D.title)}</h2><p class="note">مراجعة منزلية: ١٠ أسئلة، ٣٠ ثانية للسؤال، والدرجة القصوى ١٠٠.</p><div class="controls"><button class="btn" id="start">بدء المراجعة</button><button class="btn secondary" onclick="location.hash=''">تغيير الدرس</button></div></section><section id="play" class="hidden"><section class="card"><div style="display:flex;gap:12px;align-items:center"><b id="prog"></b><div class="spacer"></div><span class="tag" id="score">٠ / ١٠٠</span><div class="timer" id="timer">30</div></div><div class="meter"><i id="tm"></i></div><div class="qbox" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div></section></section>`;$('#start').onclick=()=>{$('#start').closest('.card').classList.add('hidden');$('#play').classList.remove('hidden');render()};
function render(){stopTimer();if(idx>=qs.length){finish();return}locked=false;left=30;start=Date.now();const q=qs[idx];$('#prog').textContent=`السؤال ${AR(idx+1)} من ١٠`;$('#score').textContent=`${AR(score)} / ١٠٠`;$('#timer').textContent=AR(left);$('#tm').style.width='100%';$('#q').textContent=q.q;$('#fb').className='feedback';$('#fb').textContent='';$('#opts').innerHTML=q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));T=setInterval(()=>{left--;$('#timer').textContent=AR(left);$('#tm').style.width=(left/30*100)+'%';if(left<=0){stopTimer();answer(-1)}},1000)}
function answer(a){if(locked)return;locked=true;stopTimer();const q=qs[idx],elapsed=Math.min(30,(Date.now()-start)/1000);let pts=0;if(a===q.answer){pts=Math.max(1,10-Math.floor(elapsed/3));score+=pts;correct++;tone(720,.12,'triangle')}else tone(180,.15,'sawtooth');document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===q.answer)b.classList.add('correct');else if(i===a)b.classList.add('wrong')});const fb=$('#fb');fb.className='feedback '+(a===q.answer?'good':'bad');fb.innerHTML=a===q.answer?`صحيح — +${AR(pts)}<br><small>${esc(q.explanation||'')}</small>`:`${a<0?'انتهى الوقت':'غير صحيح'} — ٠<br><small>${esc(q.explanation||'')}</small>`;setTimeout(()=>{idx++;render()},1500)}
function finish(){stopTimer();confetti();app.innerHTML=`<section class="card final"><h2>اكتملت المراجعة</h2><div class="bigScore">${AR(score)} / ١٠٠</div><p>الإجابات الصحيحة: ${AR(correct)} من ١٠</p><div class="controls" style="justify-content:center"><button class="btn" onclick="startHome('${id}')">إعادة المراجعة</button><button class="btn secondary" onclick="location.hash=''">الرئيسية</button></div></section>`}
}
function route(){stopTimer();const r=parseRoute();if(!r)landing();else if(r.mode==='class')startClass(r.lesson);else startHome(r.lesson)}
$('#homeBtn').onclick=()=>{location.hash='';landing()};addEventListener('hashchange',route);route();
</script>
</body></html>
