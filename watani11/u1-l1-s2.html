<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عُمان... الموقع ومظاهر السطح — الجيولوجيا والتنوع الجيولوجي</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7f6;color:#1e2a2f;line-height:1.75}.hero{background:linear-gradient(135deg,#284b3f,#0f6b5b);color:#fff;padding:22px 16px}.wrap{max-width:850px;margin:auto}h1{font-size:24px;margin:0 0 6px}.meta{opacity:.9;font-size:14px}main{padding:18px 14px 40px}.card{background:#fff;border:1px solid #dfe7e3;border-radius:16px;padding:17px;margin:0 0 14px;box-shadow:0 4px 16px #0000000a}.qno{font-weight:700;color:#0f6b5b;margin-bottom:7px}.q{font-weight:700;margin-bottom:10px}button.opt{display:block;width:100%;text-align:right;border:1px solid #d8e1dd;background:#fff;border-radius:11px;padding:11px 12px;margin:7px 0;cursor:pointer;font:inherit}button.opt:hover{border-color:#0f6b5b}button.opt.correct{background:#e5f6ef;border-color:#32956f}button.opt.wrong{background:#fdecec;border-color:#d76767}button.opt:disabled{cursor:default;color:#222}.feedback{font-size:14px;margin-top:8px;min-height:24px}.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.score{background:#fff;border:1px solid #dfe7e3;border-radius:12px;padding:8px 12px;font-weight:700}.reset{border:0;background:#7b3f25;color:#fff;border-radius:10px;padding:9px 13px;font:inherit;cursor:pointer}.done{display:none;background:#fff6df;border:1px solid #edd399;border-radius:14px;padding:15px;margin-top:14px;font-weight:700;text-align:center}.brand{font-size:13px;opacity:.85}</style></head><body>
<header class="hero"><div class="wrap"><div class="brand">منصة أفق التعليمية</div><h1>عُمان... الموقع ومظاهر السطح — الجيولوجيا والتنوع الجيولوجي</h1><div class="meta">هذا وطني — الصف الحادي عشر · الوحدة 1 · الدرس 1 · الحصة 2</div></div></header>
<main class="wrap"><div class="topbar"><div class="score" id="score">الدرجة: ٠ / 8</div><button class="reset" onclick="location.reload()">إعادة المحاولة</button></div><div id="quiz"></div><div class="done" id="done"></div></main>
<script>const Q=[{"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يحلل صورًا ونصوصًا مرتبطة بعُمان القديمة", "يدلل على تكيف الإنسان العُماني مع البيئات الداخلية والصحراوية", "يتتبع التغيرات الجيولوجية التي أسهمت في تشكيل أرض عُمان", "يبادر إلى المحافظة على الموارد الطبيعية والحياة الفطرية"], "ok": 2}, {"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يثمن المكانة الاقتصادية الرفيعة لعُمان في العصور الإسلامية", "يوضح القيمة الاقتصادية والجغرافية للتنوع الجيولوجي في عُمان", "يربط بين التأليف وإنشاء المكتبات", "يستنتج دلالات تنوع الإسهامات الثقافية"], "ok": 1}, {"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يقدر الجهود المبذولة للارتقاء بالمؤسسات الثقافية", "يحافظ على مفردات البيئة العُمانية وثرواتها الجيولوجية", "يوضح خصائص الواحات الداخلية والمناطق الرملية والسبخات", "يوضح أسباب تنوع مظاهر السطح في عُمان"], "ok": 1}, {"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يوضح مفهوم الكتاتيب وعلاقتها بمدارس القرآن الكريم", "يحدد الكتل الهوائية المؤثرة في سلطنة عُمان ويبين أثرها", "يوضح العوامل التي ساعدت على ثراء الثقافة العُمانية", "يفسر الطالب الفرق بين القوى الداخلية والخارجية المؤثرة في سطح الأرض"], "ok": 3}, {"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يوضح مفهوم المكتسبات الوطنية من أمثلة حياتية", "يعطي أمثلة على إسهامات المرأة العُمانية في الثقافة", "يرتب شفهيًا ما توصل إليه من الشكل ٤ بشأن تغير موقع عُمان", "يدلل على إسهامات العُمانيين في الطب والفلك والعلوم البحرية"], "ok": 2}, {"q": "هل العبارة التالية مرتبطة بمحتوى هذه الحصة؟ «غلق الحصة بمناقشة قيمة المحافظة على الثروات الجيولوجية، ومنها الصخور النيزكية، ويطلب من الطلاب ذكر فائدة علمية أو اقتصادية واحدة للتنوع الجيولوج…»", "opts": ["نعم", "لا"], "ok": 0}, {"q": "هل العبارة التالية مرتبطة بمحتوى هذه الحصة؟ «يوضح بعض سمات الشخصية العُمانية من النصوص والأمثلة»", "opts": ["نعم", "لا"], "ok": 1}, {"q": "أي خيار يمثل أحد أهداف/مخرجات هذه الحصة؟", "opts": ["يوضح أهمية الأخوار والكهوف والجزر ضمن تنوع مظاهر السطح", "يتتبع تطور المؤسسات الثقافية العُمانية", "يتتبع التغيرات الجيولوجية التي أسهمت في تشكيل أرض عُمان", "يقارن بين المدارس في عُمان قديمًا وحديثًا"], "ok": 2}];let score=0,answered=0;const A=['أ','ب','ج','د'];const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function render(){const box=document.getElementById('quiz');box.innerHTML=Q.map((x,i)=>`<section class="card"><div class="qno">السؤال ${ar(i+1)}</div><div class="q">${x.q}</div><div id="o${i}">${x.opts.map((o,k)=>`<button class="opt" onclick="pick(${i},${k},this)">${A[k]}) ${o}</button>`).join('')}</div><div class="feedback" id="f${i}"></div></section>`).join('')}function pick(i,k,b){const x=Q[i],wrap=document.getElementById('o'+i);if(wrap.dataset.done)return;wrap.dataset.done=1;answered++;const bs=[...wrap.querySelectorAll('button')];bs.forEach((z,j)=>{z.disabled=true;if(j===x.ok)z.classList.add('correct')});if(k===x.ok){score++;document.getElementById('f'+i).textContent='إجابة صحيحة.'}else{b.classList.add('wrong');document.getElementById('f'+i).textContent='الإجابة الصحيحة موضحة باللون الأخضر.'}document.getElementById('score').textContent=`الدرجة: ${ar(score)} / ${ar(Q.length)}`;if(answered===Q.length){const d=document.getElementById('done');d.style.display='block';d.textContent=`انتهت الأسئلة — نتيجتك ${ar(score)} من ${ar(Q.length)}.`}}render();</script></body></html>
