<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عُمان... العصور القديمة وصدر الإسلام — مسميات عُمان عبر العصور وقراءة الشواهد</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7f6;color:#1e2a2f;line-height:1.75}.hero{background:linear-gradient(135deg,#284b3f,#0f6b5b);color:#fff;padding:22px 16px}.wrap{max-width:850px;margin:auto}h1{font-size:24px;margin:0 0 6px}.meta{opacity:.9;font-size:14px}main{padding:18px 14px 40px}.card{background:#fff;border:1px solid #dfe7e3;border-radius:16px;padding:17px;margin:0 0 14px;box-shadow:0 4px 16px #0000000a}.qno{font-weight:700;color:#0f6b5b;margin-bottom:7px}.q{font-weight:700;margin-bottom:10px}button.opt{display:block;width:100%;text-align:right;border:1px solid #d8e1dd;background:#fff;border-radius:11px;padding:11px 12px;margin:7px 0;cursor:pointer;font:inherit}button.opt:hover{border-color:#0f6b5b}button.opt.correct{background:#e5f6ef;border-color:#32956f}button.opt.wrong{background:#fdecec;border-color:#d76767}button.opt:disabled{cursor:default;color:#222}.feedback{font-size:14px;margin-top:8px;min-height:24px}.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.score{background:#fff;border:1px solid #dfe7e3;border-radius:12px;padding:8px 12px;font-weight:700}.reset{border:0;background:#7b3f25;color:#fff;border-radius:10px;padding:9px 13px;font:inherit;cursor:pointer}.done{display:none;background:#fff6df;border:1px solid #edd399;border-radius:14px;padding:15px;margin-top:14px;font-weight:700;text-align:center}.brand{font-size:13px;opacity:.85}</style></head><body>
<header class="hero"><div class="wrap"><div class="brand">منصة أفق التعليمية</div><h1>عُمان... العصور القديمة وصدر الإسلام — مسميات عُمان عبر العصور وقراءة الشواهد</h1><div class="meta">هذا وطني — الصف الحادي عشر · الوحدة 1 · الدرس 3 · الحصة 1</div></div></header>
<main class="wrap"><div class="topbar"><div class="score" id="score">الدرجة: ٠ / 8</div><button class="reset" onclick="location.reload()">إعادة المحاولة</button></div><div id="quiz"></div><div class="done" id="done"></div></main>
<script>const Q=[{"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يوضح أثر التطوع والمشاركة على المجتمع", "يميز الرياح المحلية واليومية ويشرح أمثلة منها", "يناقش أهمية موقع عُمان الجغرافي قديمًا وحديثًا", "يعدد مسميات عُمان عبر العصور التاريخية"], "ok": 3}, {"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يوضح مفهوم الكتاتيب وعلاقتها بمدارس القرآن الكريم", "يحلل صورًا ونصوصًا مرتبطة بعُمان القديمة", "يحدد أهمية المواقع الأثرية العُمانية", "يوضح العلاقة بين الرياح وأنظمة الضغط الجوي واختلافها صيفًا وشتاءً"], "ok": 1}, {"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يقترح حلولًا للمشكلات التي تواجه النبات الطبيعي", "يوضح القيمة الاقتصادية والجغرافية للتنوع الجيولوجي في عُمان", "يبادر إلى المحافظة على النبات الطبيعي في عُمان", "يعتز بالموروث الحضاري العُماني"], "ok": 3}, {"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يوضح أهمية الأخوار والكهوف والجزر ضمن تنوع مظاهر السطح", "يذكر الطالب مسميين تاريخيين لعُمان وردا في الدرس", "يطبق سلوكًا واعيًا عند التعرض للأنواء المناخية", "يقدر الجهود المبذولة في نشر العلم والثقافة"], "ok": 1}, {"q": "أي عبارة ترتبط مباشرة بمحتوى هذه الحصة؟", "opts": ["يقدر الجهود المبذولة في نشر العلم والثقافة", "يستخرج معلومة تاريخية من صورة أو نص معروض", "يقترح إنشاء مؤسسة ثقافية تخدم المجتمع", "يصف خصائص المناخ في عُمان صيفًا وشتاءً"], "ok": 1}, {"q": "هل العبارة التالية مرتبطة بمحتوى هذه الحصة؟ «غلق الحصة بإعادة ترتيب المسميات التاريخية التي تناولها الطلاب وربط كل مسمى بدليل أو سياق ظهر في الخريطة أو الصور أو النصوص»", "opts": ["نعم", "لا"], "ok": 0}, {"q": "هل العبارة التالية مرتبطة بمحتوى هذه الحصة؟ «يصف خصائص المناخ في عُمان صيفًا وشتاءً»", "opts": ["نعم", "لا"], "ok": 1}, {"q": "أي خيار يمثل أحد أهداف/مخرجات هذه الحصة؟", "opts": ["يدلل على إسهامات العُمانيين في الطب والفلك والعلوم البحرية", "يعدد مسميات عُمان عبر العصور التاريخية", "يوضح صورًا من التفاعل الإيجابي في المجتمع", "يدلل على تنوع الإسهامات الثقافية العُمانية"], "ok": 1}];let score=0,answered=0;const A=['أ','ب','ج','د'];const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function render(){const box=document.getElementById('quiz');box.innerHTML=Q.map((x,i)=>`<section class="card"><div class="qno">السؤال ${ar(i+1)}</div><div class="q">${x.q}</div><div id="o${i}">${x.opts.map((o,k)=>`<button class="opt" onclick="pick(${i},${k},this)">${A[k]}) ${o}</button>`).join('')}</div><div class="feedback" id="f${i}"></div></section>`).join('')}function pick(i,k,b){const x=Q[i],wrap=document.getElementById('o'+i);if(wrap.dataset.done)return;wrap.dataset.done=1;answered++;const bs=[...wrap.querySelectorAll('button')];bs.forEach((z,j)=>{z.disabled=true;if(j===x.ok)z.classList.add('correct')});if(k===x.ok){score++;document.getElementById('f'+i).textContent='إجابة صحيحة.'}else{b.classList.add('wrong');document.getElementById('f'+i).textContent='الإجابة الصحيحة موضحة باللون الأخضر.'}document.getElementById('score').textContent=`الدرجة: ${ar(score)} / ${ar(Q.length)}`;if(answered===Q.length){const d=document.getElementById('done');d.style.display='block';d.textContent=`انتهت الأسئلة — نتيجتك ${ar(score)} من ${ar(Q.length)}.`}}render();</script></body></html>
